# Kernel settings for OTOBO with rootless Podman, installed by scripts/prepare-host.sh
# to /etc/sysctl.d/90-otobo.conf.

# Required by Elasticsearch.
vm.max_map_count = 262144

# Optional: allow the unprivileged service user to publish the ports 80 and 443.
# Without this setting nginx has to stay on 8080/8443 (the defaults in .env),
# e.g. behind a reverse proxy of your organisation.
#net.ipv4.ip_unprivileged_port_start = 80
